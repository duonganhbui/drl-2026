<style>
:root{--bg:#F8FAFC;--card:#FFFFFF;--text:#0F172A;--muted:#64748B;--line:#E2E8F0;--ok:#BBF7D0;--okt:#14532D;--pri:#B71C1C;--pri2:#D32F2F;--soft:#FEF2F2;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#131C2E;--text:#E5E7EB;--muted:#94A3B8;--line:#24304A;--ok:#14532D;--okt:#BBF7D0;--soft:#2A1416;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#131C2E;--text:#E5E7EB;--muted:#94A3B8;--line:#24304A;--ok:#14532D;--okt:#BBF7D0;--soft:#2A1416;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:'Plus Jakarta Sans',system-ui,sans-serif;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#7F1D1D;z-index:40}
.card{background:var(--card);border:1px solid var(--line);border-radius:1rem;box-shadow:0 1px 3px rgba(15,23,42,.06)}
header.hd{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(135deg,#7F1D1D,#B71C1C 55%,#E53935);color:#fff;box-shadow:0 6px 20px rgba(127,29,29,.35)}
#hint{color:rgba(255,255,255,.92)}#tot{color:#fff}header .bar{background:rgba(255,255,255,.25)}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
.chip{border:1px solid rgba(255,255,255,.35);border-radius:.75rem;padding:.25rem .6rem;font-size:.72rem;white-space:nowrap;background:rgba(255,255,255,.14);color:#fff}
.chip.full{background:#22C55E;border-color:#22C55E;font-weight:700}
.pill{border:2px solid var(--a);color:var(--a);background:var(--card);border-radius:99px;padding:.35rem .9rem;font-size:.8rem;font-weight:700;white-space:nowrap;cursor:pointer;transition:all .2s}
.pill:hover{background:var(--a);color:#fff;transform:translateY(-1px)}
.btn{border-radius:.75rem;padding:.5rem .9rem;font-size:.82rem;font-weight:600;border:1px solid var(--line);background:var(--card);cursor:pointer}
.btn.p{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.amber{background:#F59E0B;color:#1F2937;border-color:#F59E0B}.btn.blue{background:#2563EB;color:#fff;border-color:#2563EB}.btn.red{background:transparent;color:var(--pri2);border:2px solid var(--pri2)}.btn:hover{filter:brightness(.96)}
.badge{border-radius:99px;padding:.15rem .6rem;font-size:.75rem;font-weight:700;background:color-mix(in srgb,var(--a,#B71C1C) 14%,transparent);color:var(--a,#B71C1C);white-space:nowrap;transition:all .3s}
.badge.ok{background:var(--ok);color:var(--okt)}
.row{display:flex;gap:.7rem;align-items:flex-start;padding:.65rem .75rem;border-radius:.75rem;cursor:pointer;user-select:none;transition:background .2s,opacity .3s;-webkit-tap-highlight-color:transparent}
.row:hover{background:var(--bg)}.row.on{background:var(--ok);box-shadow:inset 4px 0 0 #16A34A}.row.on .bx{box-shadow:0 0 0 3px rgba(22,163,74,.25)}
.bx{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--muted);display:grid;place-items:center;color:#fff;font-size:13px;transition:all .15s;margin-top:1px}
.row.on .bx{background:#16A34A;border-color:#16A34A}.row:not(.on) .bx::after{content:""}
.row.on .bx::after{content:"✓"}
.capped .row:not(.on){opacity:.4}
.neg.row.on{background:var(--soft)}.neg.row.on .bx{background:var(--pri);border-color:var(--pri)}
.mc{font-size:.62rem;font-weight:700;border:1px solid var(--line);border-radius:6px;padding:0 .3rem;color:var(--muted);margin-left:.4rem}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s}
.open>.body{grid-template-rows:1fr}.body>div{overflow:hidden}
.chev{transition:transform .3s}.open .chev{transform:rotate(180deg)}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;padding:1rem;z-index:60}
.ov.show{display:flex}
.noscroll::-webkit-scrollbar{display:none}
</style>
</head>

</main>

];
const LV=[[90,'Xuất sắc','#16A34A','#4ADE80'],[80,'Giỏi','#0D9488','#2DD4BF'],[65,'Khá','#2563EB','#93C5FD'],[50,'Trung bình','#D97706','#FCD34D'],[0,'Yếu','#DC2626','#FCA5A5']];
const COL={TC1:'#B71C1C',TC2:'#2563EB',TC3:'#7C3AED',TC4:'#EA580C',TC5:'#0D9488','TRỪ':'#475569'};
const QUICK=['1.1.1','1.1.2','1.1.3','1.2.1','1.2.2','3.2.1','4.1.1'];
const KEY='drl2026_state';
let S=new Set();
try{S=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'))}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...S]))}catch(e){}};
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

function calc(){
  const br={},tc={};let sum=0,pen=0;
  D.forEach(m=>{let s=0;
    m.b.forEach(b=>{const raw=b.i.reduce((a,x)=>a+(S.has(x[0])?x[2]:0),0);
      br[b.id]=b.cap?Math.min(b.cap,raw):raw;s+=br[b.id]});
    tc[m.id]=m.neg?s:Math.min(m.cap,s);
    if(m.neg)pen=tc[m.id];else sum+=tc[m.id]});
  return{br,tc,pen,total:Math.min(100,Math.max(0,sum+pen))};
}

function build(){
  $('pills').innerHTML=D.map(m=>`<button class="pill" style="--a:${COL[m.id]}" data-j="${m.id}">${m.neg?'Điểm trừ':m.id}</button>`).join('');
  $('list').innerHTML=D.map((m,k)=>`<section class="card ${k==0?'open':''}" id="c-${m.id}" data-tc="${m.id}" style="--a:${COL[m.id]};border-left:6px solid var(--a)">
   <button class="w-full flex items-center gap-3 p-4 text-left" data-t="${m.id}">
    <span class="flex-none w-11 h-11 rounded-xl grid place-items-center text-white text-xs font-extrabold" style="background:var(--a)">${m.neg?'−':m.id}</span>
    <span class="flex-1 text-sm font-bold leading-snug">${m.t}</span>
    <span class="badge" id="t-${m.id}"></span><span class="chev text-xs">▼</span></button>
   <div class="body"><div><div class="px-3 pb-3 space-y-3">${m.b.map(b=>`
    <div class="rounded-xl p-2 br" id="br-${b.id}" style="border:1px solid var(--line)">
     <div class="flex items-center gap-2 px-2 py-1"><span class="flex-1 text-[13px] font-semibold" style="color:var(--muted)">${b.id}. ${b.t}</span><span class="badge" id="b-${b.id}"></span></div>
     ${b.i.map(x=>`<div class="row ${m.neg?'neg':''}" data-c="${x[0]}" data-s="${norm(x[0]+' '+x[1])}"><span class="bx"></span><span class="flex-1 text-sm leading-snug">${x[0]} ${esc(x[1])}${x[3]===0?'<span class="mc">*</span>':'<span class="mc">MC</span>'}</span><span class="text-sm font-bold" style="color:${x[2]<0?'var(--pri)':'inherit'}">${x[2]>0?'+':''}${x[2]}</span></div>`).join('')}
    </div>`).join('')}</div></div></div></section>`).join('');
}

function update(){
  const r=calc();
  document.querySelectorAll('.row').forEach(e=>e.classList.toggle('on',S.has(e.dataset.c)));
  const setB=(el,v,cap,neg)=>{const full=!neg&&cap&&v>=cap;el.textContent=neg?v:(full?'✓ ':'')+v+'/'+cap;el.classList.toggle('ok',full)};
  D.forEach(m=>{
    setB($('t-'+m.id),r.tc[m.id],m.cap,m.neg);
    m.b.forEach(b=>{if(!m.neg){setB($('b-'+b.id),r.br[b.id],b.cap);$('br-'+b.id).classList.toggle('capped',r.br[b.id]>=b.cap)}else $('b-'+b.id).textContent=r.br[b.id]});
  });
  const t=r.total,lv=LV.find(l=>t>=l[0]);
  $('tot').textContent=t;$('rank').textContent=lv[1];$('rank').style.cssText=`font-size:.85rem;background:${lv[2]};color:#fff;border:2px solid rgba(255,255,255,.7)`;
  const pg=$('pg');pg.style.width=t+'%';pg.style.background=lv[3];
  const nx=[...LV].reverse().find(l=>l[0]>t);
  $('hint').textContent=nx?`Còn thiếu ${nx[0]-t} điểm nữa để đạt mức ${nx[1]}!`:'Tuyệt vời! Bạn đã đạt mức cao nhất 🎉';
  $('mini').innerHTML=D.map(m=>{const full=!m.neg&&r.tc[m.id]>=m.cap;return `<span class="chip ${full?'full':''}"><b>${m.neg?'Trừ':m.id}</b> ${full?'✓ ':''}${r.tc[m.id]}${m.neg?'':'/'+m.cap}</span>`}).join('');
}

function modal(title,body,btns){
  $('mt').textContent=title;$('mb').innerHTML=body;$('mf').innerHTML='';
  btns.forEach(([label,cls,fn])=>{const b=document.createElement('button');b.className='btn '+cls;b.textContent=label;b.onclick=()=>{if(fn)fn(b);if(!b.dataset.keep)$('ov').classList.remove('show')};$('mf').appendChild(b)});
  $('ov').classList.add('show');
}
const items=()=>D.flatMap(m=>m.b.flatMap(b=>b.i.map(x=>({c:x[0],t:x[1],mc:x[3]!==0}))));

function filter(){
  const k=norm($('q').value.trim());let any=false;
  document.querySelectorAll('.row').forEach(e=>e.style.display=!k||e.dataset.s.includes(k)?'':'none');
  document.querySelectorAll('.br').forEach(b=>{const v=[...b.querySelectorAll('.row')].some(e=>e.style.display!=='none');b.style.display=v?'':'none'});
  document.querySelectorAll('section.card').forEach(s=>{const v=[...s.querySelectorAll('.row')].some(e=>e.style.display!=='none');s.style.display=v?'':'none';if(k&&v){s.classList.add('open');any=true}else if(v)any=true});
  $('empty').classList.toggle('hidden',any);
}

document.addEventListener('click',e=>{
  const row=e.target.closest('.row');
  if(row){const c=row.dataset.c;S.has(c)?S.delete(c):S.add(c);save();update();return}
  const t=e.target.closest('[data-t]');
  if(t){$('c-'+t.dataset.t).classList.toggle('open');return}
  const j=e.target.closest('[data-j]');
  if(j){const c=$('c-'+j.dataset.j);c.classList.add('open');setTimeout(()=>c.scrollIntoView({behavior:'smooth',block:'start'}),50)}
  if(e.target===$('ov'))$('ov').classList.remove('show');
});
$('q').addEventListener('input',filter);
$('bQuick').onclick=()=>{QUICK.forEach(c=>S.add(c));save();update()};
$('bReset').onclick=()=>modal('Làm mới bảng điểm?','<p>Toàn bộ tiêu chí đã tích sẽ bị bỏ chọn và điểm về 0. Thao tác này không thể hoàn tác.</p>',[['Hủy','',null],['Xóa hết','p',()=>{S.clear();save();update()}]]);
$('bMC').onclick=()=>{
  const l=items().filter(x=>S.has(x.c)&&x.mc);
  if(!l.length){modal('Minh chứng cần chuẩn bị','<p style="color:var(--muted)">Bạn chưa tích tiêu chí nào cần minh chứng (MC).</p>',[['Đóng','p',null]]);return}
  const txt='DANH SÁCH MINH CHỨNG CẦN CHUẨN BỊ (ĐRL 2026–2027)\n'+l.map(x=>`☐ ${x.c} ${x.t}`).join('\n');
  modal(`Minh chứng cần chuẩn bị (${l.length})`,l.map(x=>`<div class="flex gap-2"><span class="font-bold" style="color:var(--pri)">${x.c}</span><span>${esc(x.t)}</span></div>`).join(''),
   [['Đóng','',null],['📄 Copy danh sách','p',b=>{b.dataset.keep=1;const ok=()=>b.textContent='✓ Đã copy';
     const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){b.textContent='Không copy được'}a.remove()};
     navigator.clipboard?navigator.clipboard.writeText(txt).then(ok,fb):fb()}]]);
};
build();update();
</script>
</body>
</html>
